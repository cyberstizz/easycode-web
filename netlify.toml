[build]
  command = "npm run build"
  publish = "dist"


# ══════════════════════════════════════════════════════════════════════
#  API PROXY
#
#  CHANGE ONE THING IN THIS FILE: the line marked  <<<< EDIT THIS LINE
#  Replace   easycode-api-production.up.railway.app
#  with      your own Railway host
#
#  Keep everything else exactly as written — the https:// at the front,
#  the /v1/:splat at the end, and no trailing slash.
#
#  This block MUST stay above the SPA fallback below. Netlify reads
#  redirects top to bottom and stops at the first match. If /* came
#  first it would grab /v1/... too, and serve the webpage instead of
#  calling the API.
# ══════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/v1/*"
  to = "https://easycode-api-production.up.railway.app/v1/:splat"   # <<<< EDIT THIS LINE
  status = 200
  force = true


# SPA fallback — every other route is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Asset filenames contain a content hash and change every build,
# so they're safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"